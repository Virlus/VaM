[project]
name = "vam"
version = "0.1.0"
description = "VAM value-expert models, training, and data preparation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "augmax>=0.3.4",
    "dm-tree>=0.1.8",
    "einops>=0.8.0",
    "equinox>=0.11.8",
    "flatbuffers>=24.3.25",
    "flax==0.10.2",
    "fsspec[gcs]>=2024.6.0",
    "imageio>=2.36.1",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    "lerobot",
    "ml_collections==1.0.0",
    "numpy>=1.22.4,<2.0.0",
    "numpydantic>=1.6.6",
    "opencv-python>=4.10.0.84",
    "vam-client",
    "orbax-checkpoint==0.11.13",
    "pillow>=11.0.0",
    "sentencepiece>=0.2.0",
    "torch==2.7.1",
    "tqdm-loggable>=0.2",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
    "wandb>=0.19.1",
    "filelock>=3.16.1",
    "beartype==0.19.0",
    "treescope>=0.1.7",
    "transformers==4.53.2",
    "rich>=14.0.0",
    "polars>=1.30.0",
    "seaborn>=0.12,<0.14",
    "datasets>=3.6,<4",
    "hydra-core>=1.3",
    "loguru>=0.7",
    "psutil>=5.9",
    "paramiko>=3",
    "pynput>=1.7",
    "pyyaml>=6",
]


[project.optional-dependencies]
hardware = ["i2rt", "pyrealsense2>=2.55"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyte>=0.8.2",
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.0",
    "pynvml>=12.0.0",
]
[tool.uv]
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74"]

[tool.uv.sources]
i2rt = { workspace = true }
vam-client = { workspace = true }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }

[tool.uv.workspace]
members = ["packages/vam-client", "packages/i2rt"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["packages/i2rt"]

[tool.ruff.lint]
# Shared correctness gate across the consolidated sources. Entry-point path bootstraps
# intentionally precede imports; jaxtyping expressions are not Python expressions.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "F722"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["tests", "deployment/tests", "training/src", "training/preprocess_data", "packages/vam-client"]
pythonpath = ["deployment", "training", "training/src", "packages/vam-client/src", "packages/i2rt"]

[tool.hatch.build.targets.wheel]
only-include = ["training/src/vam", "training/preprocess_data"]

[tool.hatch.build.targets.wheel.sources]
"training/src/vam" = "vam"
"training/preprocess_data" = "preprocess_data"

[tool.hatch.build]
dev-mode-dirs = ["training/src", "training"]
